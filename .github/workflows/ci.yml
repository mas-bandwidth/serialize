name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # Filtering push to main means a feature branch no longer runs CI on push -- its PR
  # does. workflow_dispatch keeps a deliberate way to run the matrix on a branch, which
  # is the capability the filter would otherwise silently remove.
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]   # linux x64, macos apple silicon, windows x64
        build_type: [Debug, Release]
        include:
          - os: windows-2025
            cmake_args: -A x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

  # the only big endian coverage in the matrix: exercises the bswap / host_to_network
  # path for real, and the golden wire format test proves the wire bytes are identical
  big-endian:
    name: big endian s390x / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Install s390x cross toolchain and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-s390x-linux-gnu qemu-user-static

      # static linking so the emulated binaries need no s390x sysroot at runtime
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=s390x
          -DCMAKE_CXX_COMPILER=s390x-linux-gnu-g++
          -DCMAKE_CXX_FLAGS="-static"
          -DCMAKE_CROSSCOMPILING_EMULATOR=qemu-s390x-static

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    name: fuzz (libFuzzer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSERIALIZE_FUZZ=ON -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build --parallel

      - name: Fuzz
        run: ./build/bin/fuzz -max_total_time=60 -timeout=10 -print_final_stats=1

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # the strictest language mode a real consumer compiles the vendored header in. Every other job
  # builds at the toolchain default (>= C++14), which is how a functional-style cast routed through
  # a C++11-only explicit conversion operator shipped: yojimbo's macOS leg builds at Apple clang's
  # default (gnu++98) and was the first thing to compile the header pre-C++11. clang specifically,
  # because the guarded property is "compiles in C++98/03 with the declaration-only C++11
  # extensions accepted as warnings" — the profile of the consumer that broke (gcc hard-errors on
  # those extensions, so it cannot check this). SERIALIZE_ENABLE_TESTS forces the emulated 128 bit
  # pair even on native-__int128 hosts, exactly as yojimbo's test build does; the second compile
  # drops native __int128 so the emulated pair is the real storage type on the wire.
  cxx03-consumer:
    name: pre-C++11 consumer (clang -std=c++03)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      # -ffp-contract=off, not -ffast-math: this binary runs the golden and conformance
      # vectors, and those pin exact bytes and decoded bit patterns. Same rationale as
      # SERIALIZE_DEV_FLAGS in CMakeLists.txt — the gates build strict.
      - name: Build and run tests at -std=c++03 (emulated pair alongside native)
        run: |
          clang++ -std=c++03 -DSERIALIZE_ENABLE_TESTS=1 -DSERIALIZE_DEBUG -Wall -Wextra -ffp-contract=off -fno-rtti test.cpp -o test_cxx03
          ./test_cxx03

      - name: Build and run tests at -std=c++03 (emulated pair as the serialize types)
        run: |
          clang++ -std=c++03 -DSERIALIZE_ENABLE_TESTS=1 -DSERIALIZE_DEBUG -U__SIZEOF_INT128__ -Wall -Wextra -ffp-contract=off -fno-rtti test.cpp -o test_cxx03_no_int128
          ./test_cxx03_no_int128

      # The shared corpus at the same floor. The int128 vector is the reason it belongs here as
      # well as in the cmake matrix: the second build makes the emulated pair the real storage
      # type, which is the configuration a degenerate 128 bit range last diverged in.
      - name: Run the conformance corpus at -std=c++03
        run: |
          clang++ -std=c++03 -DSERIALIZE_DEBUG -Wall -Wextra -ffp-contract=off -fno-rtti conformance.cpp -o conformance_cxx03
          ./conformance_cxx03 conformance/*.txt
          clang++ -std=c++03 -DSERIALIZE_DEBUG -U__SIZEOF_INT128__ -Wall -Wextra -ffp-contract=off -fno-rtti conformance.cpp -o conformance_cxx03_no_int128
          ./conformance_cxx03_no_int128 conformance/*.txt

  # serialize.h is clean under the flags a strict consumer builds with: -Wconversion -Wsign-conversion
  # -Wcast-qual -Wundef, as errors, on both compilers. The serialize macros expand at the caller, so the
  # check is a consumer translation unit (warnings.cpp) that touches every macro with destinations of every
  # width and signedness, plus the embedded tests (test.cpp), which are part of the header. Every cast that
  # keeps it clean is the conversion the code already did, spelled out: the machine code is unchanged.
  strict-warnings:
    name: strict warnings (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang++, g++]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: The consumer translation unit and the embedded tests, four flags as errors
        run: |
          for std in c++11 c++17 c++20; do
            for mode in "-DSERIALIZE_DEBUG" "-DSERIALIZE_RELEASE -O2"; do
              ${{ matrix.compiler }} -std=$std -I. -Wall -Wextra -Wconversion -Wsign-conversion -Wcast-qual -Wundef -Werror -ffp-contract=off -fno-rtti $mode -c warnings.cpp -o /dev/null
              ${{ matrix.compiler }} -std=$std -I. -Wall -Wextra -Wconversion -Wsign-conversion -Wcast-qual -Wundef -Werror -ffp-contract=off -fno-rtti -DSERIALIZE_ENABLE_TESTS=1 $mode -c test.cpp -o /dev/null
            done
          done

      # NEGATIVE CONTROL: the job must be able to go red. A scratch copy of the header with one of the
      # casts taken out again has to fail the consumer translation unit; if it passes, the flags are not
      # reaching the header and every green above is worth nothing.
      - name: Control, a header with one cast removed must fail
        run: |
          mkdir control && cp serialize.h warnings.cpp control/
          sed -i 's/normalizedValue \* (float) max_integer_value;/normalizedValue * max_integer_value;/' control/serialize.h
          cmp -s serialize.h control/serialize.h && { echo "::error::the control sabotaged nothing"; exit 1; }
          if ${{ matrix.compiler }} -std=c++17 -Icontrol -Wall -Wextra -Wconversion -Wsign-conversion -Wcast-qual -Wundef -Werror -DSERIALIZE_DEBUG -c control/warnings.cpp -o /dev/null; then
            echo "::error::the strict warnings job did not notice a removed cast"
            exit 1
          fi
          echo "the sabotaged header failed, as it must"

  roadmap:
    name: roadmap drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      # ROADMAP.md is generated from docs/roadmap.sexp by tools/roadmap/render.lisp (SBCL).
      # The check fails when the committed page is not what the data renders.
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sbcl

      - name: roadmap-check
        run: make -f tools/roadmap/roadmap.mk roadmap-check

  conformance:
    name: STANDARD.md conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      # Checks the wire-format specification against the implementation. The
      # checker parses artifacts the real library produces using ONLY what
      # STANDARD.md states, with no reference to the source. A failure means
      # the document and the code disagree — decide which is wrong, and fix
      # that one. A specification nothing verifies drifts, and a drifted spec
      # is worse than none because independent implementations are built on it.
      - name: Verify STANDARD.md
        working-directory: tools/conformance
        run: go run .

      # The negative control the C++ gate runs as a ctest target, run against the Go
      # checker too: the contract that a vector whose operation has no runner must FAIL
      # rather than be skipped binds every gate, and a gate nobody has seen go red is a
      # claim rather than a measurement. This step passes exactly when the checker
      # rejects the control.
      - name: Negative control - an operation with no runner must fail the checker
        working-directory: tools/conformance
        run: |
          if go run . ../../conformance-controls/unknown-operation.txt; then
            echo "the checker accepted a vector whose operation it cannot drive"
            exit 1
          fi
          echo "the checker rejected the control, as the corpus contract requires"

      # The citation check's own negative control: a page with a rule that cites nothing and a
      # citation of a vector that does not exist. STANDARD.md states no rule without the vectors
      # that prove it, and this step passes exactly when the check that holds it to that goes red.
      - name: Negative control - a rule that cites no vector must fail the citation check
        working-directory: tools/conformance
        run: |
          if go run . --citations ../../conformance-controls/uncited-rule.md; then
            echo "the citation check accepted a page with an uncited rule"
            exit 1
          fi
          echo "the citation check rejected the control, as STANDARD.md requires"

