name: Nightly Diff

# THE NIGHTLY CROSS-PORT DIFFERENTIAL, against the reference's live output.
#
# Every port already has a nightly that holds it to this repository's committed corpus. That is the
# instrument, and it never changes shape: STANDARD.md says the corpus is never generated from an
# implementation. This job asks the question the corpus cannot: on inputs nobody wrote by hand, does
# each port decide exactly as the C++ reference does today?
#
# Each night it builds tools/diff/diffgen.cpp, which writes random programs of operations with the
# reference writer, damages about half the streams, and records the reference reader's verdict (the
# decoded values and bits consumed, or the refusal reason) in the corpus's own sequence format. Every
# port, checked out at the release COMPATIBILITY.txt names for it, then runs its own conformance runner
# over that file. The generated file is never committed and never joins the corpus. A red leg names the
# vector, and the seed is in the vector's name: reproduce it with
#   diffgen <seed> <count> out.txt
# and the hand written corpus decides whether the port or the reference is the bug.
#
# NEGATIVE CONTROL. Dispatch with negative_control=true and the job flips one byte of one generated
# canonical record before any port sees it. Every leg MUST go red. An instrument nobody has seen go red
# is a claim and not a measurement. Nothing is committed.
#
# A functional test (real toolchains, clones of other repositories): nightly and dispatch only, never on
# push or pull_request, so the per-commit budget is untouched.

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Generator seed (default: the date, so every night differs)'
        default: ''
        required: false
      count:
        description: 'Records to generate'
        default: '5000'
        required: false
      negative_control:
        description: 'Flip one byte of one generated canonical record; every leg must go red'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate:
    name: generate the vectors with the C++ reference
    runs-on: ubuntu-24.04
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Seed
        id: seed
        run: |
          seed="${{ inputs.seed }}"
          if [ -z "$seed" ]; then seed=$(date -u +%Y%m%d); fi
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "seed: $seed"

      - name: Build the reference and certify the committed corpus
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure -j 4

      - name: Generate
        run: |
          mkdir -p corpus/conformance
          # the committed corpus rides along: several runners read the whole directory (their golden
          # message test needs message.txt). Generated vectors are named diff-<seed>-<n>
          cp conformance/*.txt corpus/conformance/
          ./build/bin/diffgen "${{ steps.seed.outputs.seed }}" "${{ inputs.count || '5000' }}" corpus/conformance/diff.txt
          cp -R conformance-controls corpus/

      - name: Negative control, flip one byte of one canonical record
        if: ${{ inputs.negative_control }}
        run: |
          awk 'BEGIN { RS = ""; ORS = "\n\n" }
               done == 0 && /writer canonical/ && /\nbytes [0-9A-F][0-9A-F]/ {
                 n = index($0, "\nbytes ")
                 head = substr($0, 1, n + 6)
                 rest = substr($0, n + 7)
                 c = substr(rest, 1, 1)
                 flipped = substr("1032547698BADCFE", index("0123456789ABCDEF", c), 1)
                 $0 = head flipped substr(rest, 2)
                 done = 1
               }
               { print }' corpus/conformance/diff.txt > corpus/conformance/diff.flipped
          if cmp -s corpus/conformance/diff.txt corpus/conformance/diff.flipped; then
            echo "::error::the negative control flipped nothing"
            exit 1
          fi
          mv corpus/conformance/diff.flipped corpus/conformance/diff.txt
          echo "::warning::NEGATIVE CONTROL: one byte flipped in a generated record. Every leg must go red."

      - name: Record canonical corpus manifest
        run: |
          python3 - << 'EOF'
          import glob, hashlib, json, os, re, subprocess

          with open("COMPATIBILITY.txt", "r") as f:
              compat = f.read()

          def top_field(name):
              m = re.search(rf"^{name}\s+(\S+)", compat, re.M)
              return m.group(1) if m else ""

          cpp_release = ""
          m_cpp = re.search(r"^runtime\s+serialize\n(?:.*\n)*?release\s+(\S+)", compat, re.M)
          if m_cpp:
              cpp_release = m_cpp.group(1)

          ref_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          h = hashlib.sha256()
          committed_records = 0
          generated_records = 0
          for path in sorted(glob.glob("corpus/conformance/*.txt")):
              with open(path, "rb") as bf:
                  data = bf.read()
              h.update(os.path.basename(path).encode("utf-8") + b"\0" + data + b"\0")
              blocks = [b for b in data.decode("utf-8").strip().split("\n\n") if b.strip() and not b.strip().startswith("#")]
              if os.path.basename(path) == "diff.txt":
                  generated_records = len(blocks)
              else:
                  committed_records += len(blocks)

          meta = {
              "model": "linear-canonical-oracle",
              "reference_repository": "mas-bandwidth/serialize",
              "reference_release": cpp_release,
              "reference_commit": ref_commit,
              "format_version": top_field("format_version"),
              "standard_commit": top_field("standard_commit"),
              "corpus_commit": top_field("corpus_commit"),
              "seed": "${{ steps.seed.outputs.seed }}",
              "requested_count": int("${{ inputs.count || '5000' }}"),
              "negative_control": "${{ inputs.negative_control }}" == "true",
              "committed_records": committed_records,
              "generated_records": generated_records,
              "corpus_sha256": h.hexdigest(),
              "cpp_reference": {
                  "port": "cpp",
                  "runtime": "serialize",
                  "repository": "mas-bandwidth/serialize",
                  "tier": "original-nine",
                  "release": cpp_release,
                  "commit": ref_commit,
                  "gating": True,
                  "status": "success",
                  "reader_canonical_and_diff": "passed",
                  "writer_canonical_byte_identity": "passed",
                  "negative_controls": "passed",
                  "explicit_gap": ""
              }
          }
          with open("corpus/meta.json", "w") as out:
              json.dump(meta, out, indent=2)
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        with:
          name: diff-corpus
          path: corpus

  port:
    name: ${{ matrix.port }} against the reference
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # ADVISORY legs (continue-on-error): lua and nut run the committed corpus and their sabotage
    # controls in the same test target, and a control names exactly the vectors its sabotaged reader must
    # fail, so any added file trips it ("red but not listed: diff-...") although the port's own corpus test
    # passes; goose and lobster assert the corpus's record count at the end of the run. moo and luau
    # are gating: their runners take a second corpus directory (moorun -extra, luaurun
    # SERIALIZE_CORPUS_EXTRA_DIR) that joins an ordinary run and never a control run. Their per-vector
    # verdict on the generated file is still in the log (lines naming diff-<seed>-<n>), and a failure of
    # their corpus test shows there. They go gating when each runner grows a way to take a second directory
    # (owed to the port workers).
    continue-on-error: ${{ contains(fromJSON('["lua","nut","goose","lobster"]'), matrix.port) }}
    strategy:
      fail-fast: false
      matrix:
        port: [c, go, rs, js, java, cs, dart, elixir, lua, luau, nut, goose, lobster, moo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      # the release COMPATIBILITY.txt names for this port, the same row the family matrix proves
      - name: Resolve the port's release
        id: row
        run: |
          release=$(awk -v key="serialize.${{ matrix.port }}" '
            $1 == "runtime" { current = $2 }
            current == key && $1 == "release" { print $2; exit }' COMPATIBILITY.txt)
          if [ -z "$release" ]; then
            echo "::error::COMPATIBILITY.txt has no release row for serialize.${{ matrix.port }}"
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "serialize.${{ matrix.port }} $release, seed ${{ needs.generate.outputs.seed }}"

      - name: Check out the port at that release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          repository: mas-bandwidth/serialize.${{ matrix.port }}
          ref: ${{ steps.row.outputs.release }}
          path: port

      - name: Record checked-out port commit SHA
        id: port_sha
        run: |
          sha=$(git -C port rev-parse HEAD)
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "serialize.${{ matrix.port }} @ ${{ steps.row.outputs.release }} ($sha)""

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8
        with:
          name: diff-corpus
          path: corpus

      - name: Corpus root
        run: |
          echo "ROOT=$GITHUB_WORKSPACE/corpus" >> "$GITHUB_ENV"
          echo "DIR=$GITHUB_WORKSPACE/corpus/conformance" >> "$GITHUB_ENV"
          echo "CONTROLS=$GITHUB_WORKSPACE/corpus/conformance-controls" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ toolchains
      # the pinned Lobster binary links OpenGL even for a headless run
      - name: lobster runtime libraries
        if: ${{ matrix.port == 'lobster' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopengl0 libgl1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7
        if: ${{ matrix.port == 'go' }}
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7
        if: ${{ matrix.port == 'luau' }}
        with:
          go-version-file: port/tools/luaurun/go.mod
          cache: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7
        if: ${{ matrix.port == 'moo' }}
        with:
          go-version-file: port/tools/moorun/go.mod
          cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        if: ${{ matrix.port == 'js' }}
        with:
          node-version: 22

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3   # v4
        if: ${{ matrix.port == 'java' }}
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-dotnet@v6
        if: ${{ matrix.port == 'cs' }}
        with:
          dotnet-version: 10.0.x

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d   # v1
        if: ${{ matrix.port == 'dart' }}
        with:
          sdk: 3.13.2

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124   # v1
        if: ${{ matrix.port == 'elixir' }}
        env:
          ImageOS: ubuntu24
        with:
          otp-version: "29.0"
          elixir-version: "1.20.4"

      # ------------------------------------------------------------------ the port's own runner, over the generated file
      - name: c
        if: ${{ matrix.port == 'c' }}
        working-directory: port
        env:
          SERIALIZE_CONFORMANCE_ROOT: ${{ env.ROOT }}
        run: make build/conformance && ./build/conformance

      - name: go
        if: ${{ matrix.port == 'go' }}
        working-directory: port
        env:
          SERIALIZE_CONFORMANCE_ROOT: ${{ env.ROOT }}
        run: go test -count=1 -run '^TestConformance(Corpus|Root)$' .

      - name: rs
        if: ${{ matrix.port == 'rs' }}
        working-directory: port
        env:
          SERIALIZE_CONFORMANCE_ROOT: ${{ env.ROOT }}
        run: cargo test --release --test conformance -- --nocapture

      - name: js
        if: ${{ matrix.port == 'js' }}
        working-directory: port
        env:
          SERIALIZE_CONFORMANCE_DIR: ${{ env.DIR }}
        run: |
          node --test test/conformance.test.js
          NODE_ENV=production node --test test/conformance.test.js

      - name: java
        if: ${{ matrix.port == 'java' }}
        working-directory: port
        env:
          SERIALIZE_CONFORMANCE_DIR: ${{ env.DIR }}
          SERIALIZE_CONFORMANCE_CONTROLS_DIR: ${{ env.CONTROLS }}
        run: make conformance JDK_HOME="$JAVA_HOME"

      - name: cs
        if: ${{ matrix.port == 'cs' }}
        working-directory: port
        env:
          SERIALIZE_CONFORMANCE_DIR: ${{ env.DIR }}
          SERIALIZE_CONFORMANCE_CONTROLS_DIR: ${{ env.CONTROLS }}
        run: dotnet run -c Release --project tests/Tests.csproj -f net10.0 -- conformance

      - name: dart
        if: ${{ matrix.port == 'dart' }}
        working-directory: port
        env:
          SERIALIZE_CONFORMANCE_DIR: ${{ env.DIR }}
        run: |
          dart pub get
          dart run test/conformance_test.dart
          dart --enable-asserts run test/conformance_test.dart

      - name: elixir
        if: ${{ matrix.port == 'elixir' }}
        working-directory: port
        env:
          SERIALIZE_CORPUS_DIR: ${{ env.ROOT }}
        run: |
          mix deps.get
          mix test test/conformance_test.exs --warnings-as-errors

      - name: lua
        if: ${{ matrix.port == 'lua' }}
        working-directory: port
        env:
          SERIALIZE_CORPUS_DIR: ${{ env.ROOT }}
        run: |
          make dist-lua
          make test T=conformance

      - name: luau
        if: ${{ matrix.port == 'luau' }}
        working-directory: port
        env:
          SERIALIZE_CORPUS_DIR: ${{ env.ROOT }}
        run: |
          make dist-luau
          make test T=conformance

      - name: nut
        if: ${{ matrix.port == 'nut' }}
        working-directory: port
        env:
          SERIALIZE_CORPUS_DIR: ${{ env.ROOT }}
        run: |
          make dist-squirrel
          make test T=conformance

      - name: goose
        if: ${{ matrix.port == 'goose' }}
        working-directory: port
        env:
          SERIALIZE_CONFORMANCE_DIR: ${{ env.DIR }}
        run: |
          make dist-goose
          make test

      - name: lobster
        if: ${{ matrix.port == 'lobster' }}
        working-directory: port
        env:
          SERIALIZE_CONFORMANCE_DIR: ${{ env.DIR }}
          SERIALIZE_CONFORMANCE_CONTROLS_DIR: ${{ env.CONTROLS }}
        run: |
          make dist-lobster
          make test

      - name: moo
        if: ${{ matrix.port == 'moo' }}
        working-directory: port
        run: |
          # the committed corpus and the controls as the reference ships them; the generated file
          # alone goes in a second directory, which no control run reads
          mkdir -p "$RUNNER_TEMP/moo-corpus" "$RUNNER_TEMP/moo-extra"
          cp "${{ env.DIR }}"/*.txt "$RUNNER_TEMP/moo-corpus/"
          mv "$RUNNER_TEMP/moo-corpus/diff.txt" "$RUNNER_TEMP/moo-extra/"
          make dist-moo JOBS=4
          make test MOORUN_FLAGS="-corpus $RUNNER_TEMP/moo-corpus -controls ${{ env.CONTROLS }} -extra $RUNNER_TEMP/moo-extra"

      - name: Record port interoperability report
        if: always()
        run: |
          mkdir -p report
          python3 - << 'EOF'
          import json

          port = "${{ matrix.port }}"
          status = "${{ job.status }}"
          original_nine = {"c", "cs", "go", "rs", "java", "js", "dart", "elixir"}
          advisory_gaps = {
              "lua": "Runner executes sabotage controls in the same target as the corpus; extra generated diff.txt vectors fail the fixed expected-failure list until an extra-corpus flag is wired.",
              "nut": "Runner executes sabotage controls in the same target as the corpus; extra generated diff.txt vectors fail the fixed expected-failure list until an extra-corpus flag is wired.",
              "goose": "Runner asserts the committed corpus record count at the end of the run; extra generated diff.txt vectors trip the fixed count check until an extra-corpus flag is wired.",
              "lobster": "Runner asserts the committed corpus record count at the end of the run; extra generated diff.txt vectors trip the fixed count check until an extra-corpus flag is wired.",
          }
          verdict = "passed" if status == "success" else "failed"
          rec = {
              "port": port,
              "runtime": f"serialize.{port}",
              "repository": f"mas-bandwidth/serialize.{port}",
              "tier": "original-nine" if port in original_nine else "expansion",
              "release": "${{ steps.row.outputs.release }}",
              "commit": "${{ steps.port_sha.outputs.commit }}",
              "gating": port not in advisory_gaps,
              "status": status,
              "reader_canonical_and_diff": verdict,
              "writer_canonical_byte_identity": verdict,
              "negative_controls": verdict,
              "explicit_gap": advisory_gaps.get(port, "")
          }
          with open(f"report/port-{port}.json", "w") as f:
              json.dump(rec, f, indent=2)
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        if: always()
        with:
          name: port-${{ matrix.port }}-report
          path: report

  summary:
    name: record interoperability summary
    needs: [generate, port]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8
        with:
          name: diff-corpus
          path: corpus

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8
        with:
          pattern: port-*-report
          path: reports
          merge-multiple: true

      - name: Render 9-language interoperability summary and JSON artifact
        run: |
          mkdir -p summary
          python3 - << 'EOF'
          import glob, json, os

          with open("corpus/meta.json", "r") as f:
              meta = json.load(f)

          by_port = {"cpp": meta["cpp_reference"]}
          for path in sorted(glob.glob("reports/port-*.json")):
              with open(path, "r") as pf:
                  rec = json.load(pf)
              by_port[rec["port"]] = rec

          orig_order = ["cpp", "c", "cs", "go", "rs", "java", "js", "dart", "elixir"]
          exp_order = ["lua", "luau", "nut", "goose", "lobster", "moo"]

          original_nine = [by_port[p] for p in orig_order if p in by_port]
          expansion_ports = [by_port[p] for p in exp_order if p in by_port]
          all_orig_passed = (
              len(original_nine) == len(orig_order)
              and all(r["status"] == "success" for r in original_nine)
          )
          explicit_gaps = [
              {"port": r["port"], "runtime": r["runtime"], "gap": r["explicit_gap"]}
              for r in (original_nine + expansion_ports)
              if r.get("explicit_gap")
          ]

          out = {
              "model": meta["model"],
              "format_version": meta["format_version"],
              "standard_commit": meta["standard_commit"],
              "corpus_commit": meta["corpus_commit"],
              "reference_repository": meta["reference_repository"],
              "reference_release": meta["reference_release"],
              "reference_commit": meta["reference_commit"],
              "seed": meta["seed"],
              "requested_count": meta["requested_count"],
              "negative_control": meta["negative_control"],
              "committed_records": meta["committed_records"],
              "generated_records": meta["generated_records"],
              "corpus_sha256": meta["corpus_sha256"],
              "all_original_nine_passed": all_orig_passed,
              "original_nine": original_nine,
              "expansion_ports": expansion_ports,
              "explicit_gaps": explicit_gaps,
          }
          with open("summary/interoperability.json", "w") as f:
              json.dump(out, f, indent=2)

          lines = []
          lines.append("## Nightly Interoperability Summary (Linear Canonical Oracle)")
          lines.append("")
          lines.append("- **Oracle model**: C++ reference certifies the canonical corpus + generated `diff.txt` once; every port reader consumes that exact corpus and every port writer output is checked byte-for-byte against the canonical bytes.")
          lines.append(f"- **Format version**: `{meta['format_version']}`")
          lines.append(f"- **Reference**: `{meta['reference_repository']}` @ `{meta['reference_release']}` (`{meta['reference_commit']}`)")
          lines.append(f"- **Pinned `STANDARD.md` commit**: `{meta['standard_commit']}`")
          lines.append(f"- **Pinned `conformance/` commit**: `{meta['corpus_commit']}`")
          lines.append(f"- **Seed / Records**: seed `{meta['seed']}`, `{meta['committed_records']}` committed + `{meta['generated_records']}` generated records (`sha256:{meta['corpus_sha256']}`)")
          lines.append(f"- **Negative control active**: `{meta['negative_control']}`")
          lines.append(f"- **All 9 original languages passed**: `{all_orig_passed}`")
          lines.append("")
          lines.append("### Original Nine Languages (`cpp`, `c`, `cs`, `go`, `rs`, `java`, `js`, `dart`, `elixir`)")
          lines.append("")
          lines.append("| Port | Repository | Release | Commit SHA | Reader (Corpus + Diff) | Writer (Canonical Byte Identity) | Negative Controls | Explicit Gaps |")
          lines.append("| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |")
          for r in original_nine:
              gap = r["explicit_gap"] if r["explicit_gap"] else "none"
              lines.append(
                  f"| `{r['port']}` | `{r['repository']}` | `{r['release']}` | `{r['commit']}` | `{r['reader_canonical_and_diff']}` | `{r['writer_canonical_byte_identity']}` | `{r['negative_controls']}` | {gap} |"
              )
          lines.append("")
          lines.append("### Expansion Languages (`lua`, `luau`, `nut`, `goose`, `lobster`, `moo`)")
          lines.append("")
          lines.append("| Port | Repository | Release | Commit SHA | Gating | Reader | Writer | Explicit Gaps |")
          lines.append("| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |")
          for r in expansion_ports:
              gap = r["explicit_gap"] if r["explicit_gap"] else "none"
              lines.append(
                  f"| `{r['port']}` | `{r['repository']}` | `{r['release']}` | `{r['commit']}` | `{r['gating']}` | `{r['reader_canonical_and_diff']}` | `{r['writer_canonical_byte_identity']}` | {gap} |"
              )

          md = "\n".join(lines) + "\n"
          with open("summary/interoperability.md", "w") as f:
              f.write(md)
          print(md)
          EOF
          cat summary/interoperability.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        if: always()
        with:
          name: interoperability-summary
          path: summary
