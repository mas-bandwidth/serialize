name: Release Check

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-check:
    name: version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check versions
        run: |
          cmake_version=$(sed -nE 's/^project\(serialize VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          header_full=$(sed -nE 's/^#define SERIALIZE_VERSION[[:space:]]+"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' serialize.h)
          major=$(sed -nE 's/^#define SERIALIZE_VERSION_MAJOR[[:space:]]+([0-9]+).*/\1/p' serialize.h)
          minor=$(sed -nE 's/^#define SERIALIZE_VERSION_MINOR[[:space:]]+([0-9]+).*/\1/p' serialize.h)
          patch=$(sed -nE 's/^#define SERIALIZE_VERSION_PATCH[[:space:]]+([0-9]+).*/\1/p' serialize.h)
          if [ -z "$cmake_version" ] || [ -z "$header_full" ] || [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
            echo "::error::Could not extract versions (CMakeLists.txt: '$cmake_version', SERIALIZE_VERSION: '$header_full', MAJOR/MINOR/PATCH: '$major.$minor.$patch')"
            exit 1
          fi
          echo "CMakeLists.txt project version: $cmake_version"
          echo "serialize.h SERIALIZE_VERSION:  $header_full"
          echo "serialize.h MAJOR.MINOR.PATCH:  $major.$minor.$patch"
          if [ "$header_full" != "$major.$minor.$patch" ]; then
            echo "::error::SERIALIZE_VERSION ($header_full) does not match SERIALIZE_VERSION_MAJOR/MINOR/PATCH ($major.$minor.$patch) in serialize.h"
            exit 1
          fi
          if [ "$cmake_version" != "$header_full" ]; then
            echo "::error::project(serialize VERSION $cmake_version) in CMakeLists.txt does not match SERIALIZE_VERSION ($header_full) in serialize.h"
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/*)
              tag_version="${GITHUB_REF_NAME#v}"
              echo "Release tag version:            $tag_version"
              if [ "$tag_version" != "$cmake_version" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match version $cmake_version in CMakeLists.txt and serialize.h — bump both as part of the release."
                exit 1
              fi
              ;;
          esac

  # Version-site agreement alone cannot see the other failure mode: main drifting past the
  # newest release with wire-affecting changes aboard and nothing announcing that a release
  # is owed. That happened — four merged PRs including a wire change, and every run above
  # stayed green because the version numbers still agreed with each other. This job is the
  # missing signal. It runs on push to main only: on a PR it would demand a version bump
  # inside every wire-touching PR, which is not the process — the release train is main's.
  unreleased-wire-changes:
    name: unreleased wire changes
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # tags and full history: the whole job is a comparison against the newest tag

      - name: Compare main against the newest release tag
        run: |
          newest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$newest_tag" ]; then
            echo "No v* tags exist — nothing to compare against."
            exit 0
          fi
          total=$(git rev-list --count "$newest_tag"..HEAD)
          echo "Newest tag: $newest_tag ($total commit(s) behind HEAD)"
          if [ "$total" -eq 0 ]; then
            echo "main is exactly at $newest_tag."
            exit 0
          fi
          # serialize.h is a SINGLE-HEADER LIBRARY WITH ITS TEST SUITE INSIDE IT —
          # the test section is currently larger than the library part. So "this
          # commit touched serialize.h" is not the same question as "this commit
          # changed the wire", and asking the first one demands a release for
          # adding a test.
          #
          # That is not a harmless false alarm. A gate that cries wolf on test
          # commits is a gate people learn to merge past, and this one exists
          # precisely because a real wire change once shipped unannounced.
          #
          # So compare only the part of serialize.h OUTSIDE the test section.
          # STANDARD.md has no test section and keeps counting whole.
          #
          # FAIL CLOSED: if the markers are missing, duplicated, or out of order
          # we cannot tell library from test, and the safe answer is the old
          # behaviour — the whole file counts.
          library_part() {
            ref="$1"
            git show "${ref}:serialize.h" > /tmp/_sh_full.h 2>/dev/null || return 1
            starts=$(grep -c '^#if SERIALIZE_ENABLE_TESTS$' /tmp/_sh_full.h)
            ends=$(grep -c '^#endif // #if SERIALIZE_ENABLE_TESTS$' /tmp/_sh_full.h)
            [ "$starts" = "1" ] && [ "$ends" = "1" ] || return 1
            s=$(grep -n '^#if SERIALIZE_ENABLE_TESTS$' /tmp/_sh_full.h | cut -d: -f1)
            e=$(grep -n '^#endif // #if SERIALIZE_ENABLE_TESTS$' /tmp/_sh_full.h | cut -d: -f1)
            [ "$s" -lt "$e" ] || return 1
            sed -n "1,$((s - 1))p" /tmp/_sh_full.h
            sed -n "$((e + 1)),\$p" /tmp/_sh_full.h
          }

          standard_log=$(git log --oneline "$newest_tag"..HEAD -- STANDARD.md)
          header_log=$(git log --oneline "$newest_tag"..HEAD -- serialize.h)

          header_is_wire=""
          if [ -n "$header_log" ]; then
            if library_part "$newest_tag" > /tmp/lib_tag.h && library_part HEAD > /tmp/lib_head.h; then
              if diff -q /tmp/lib_tag.h /tmp/lib_head.h > /dev/null; then
                echo "serialize.h changed since $newest_tag, but only inside #if SERIALIZE_ENABLE_TESTS — its $(wc -l < /tmp/lib_tag.h | tr -d ' ') library lines are identical. Not a wire change."
              else
                header_is_wire="yes"
                echo "serialize.h's library section changed since $newest_tag ($(diff /tmp/lib_tag.h /tmp/lib_head.h | grep -c '^[<>]') lines)."
              fi
            else
              header_is_wire="yes"
              echo "::warning::Could not locate a single '#if SERIALIZE_ENABLE_TESTS' section in serialize.h at $newest_tag or at HEAD — counting the whole file as wire-affecting, which is the safe answer. If those markers were renamed or split, update this job to match."
            fi
          fi

          wire_log=""
          [ -n "$header_is_wire" ] && wire_log="$header_log"
          if [ -n "$standard_log" ]; then
            wire_log=$(printf '%s\n%s' "$wire_log" "$standard_log" | grep -v '^$')
          fi

          if [ -z "$wire_log" ]; then
            echo "main is $total commit(s) past $newest_tag, none changing wire-affecting content (serialize.h outside its test section, STANDARD.md). Fine."
            exit 0
          fi
          count=$(printf '%s\n' "$wire_log" | wc -l | tr -d ' ')
          {
            echo "## Unreleased wire-affecting changes"
            echo ""
            echo "main is **$total** commit(s) past **$newest_tag**, and **$count** touch wire-affecting paths (serialize.h, STANDARD.md):"
            echo ""
            echo '```'
            printf '%s\n' "$wire_log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          version=$(sed -nE 's/^project\(serialize VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          tag_version="${newest_tag#v}"
          if [ "$version" = "$tag_version" ]; then
            echo "::error::main carries $count wire-affecting commit(s) past $newest_tag and the version is still $version — nothing announces that a release is owed. Bump the version and tag a release (or revert the wire change). The commit list is in the job summary."
            exit 1
          fi
          echo "::warning::main carries $count wire-affecting commit(s) past $newest_tag. The version is already bumped to $version — tag v$version when the release is ready. The commit list is in the job summary."
