\* The count is checked before it is multiplied. Every count that does not fit
\* the cursor is an empty reader refused as value_out_of_range, and a later
\* request does not change that reason. TLC must find no error.
SPECIFICATION SizeSpec
CONSTANTS
    WireReasons = {"past_end", "value_out_of_range", "nonzero_padding"}
    MaxDepth = 3
    OldLatch = FALSE
    OldFail = FALSE
INVARIANTS
    BadCountIsEmpty
    CursorRoom
PROPERTIES
    ReasonStays
