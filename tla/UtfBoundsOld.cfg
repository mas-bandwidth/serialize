\* The reversed witness: the addition forms. TLC must report UtfInBounds violated,
\* by an append or a scan whose wrapped sum falls below the capacity or the length.
SPECIFICATION UtfSpec
CONSTANTS
    WireReasons = {"past_end", "value_out_of_range", "nonzero_padding"}
    MaxDepth = 3
    OldLatch = FALSE
    OldFail = FALSE
    UtfAppendAccepts <- UtfAppendAcceptsOld
    UtfScanAccepts <- UtfScanAcceptsOld
INVARIANTS
    UtfTypeOK
    UtfInBounds
