\* The reversed witness: the UTF length checks in the addition order, wrapping
\* at the machine width before the comparison. TLC must report UtfBounds
\* violated by a step near the top of the machine whose wrapped sum reads as
\* fitting (for example an output length of MaxInt - 1, a capacity of MaxInt
\* and a needed count of 4, whose accepted output length wraps negative).
SPECIFICATION UtfSpecOld
CONSTANTS
    WireReasons = {"past_end", "value_out_of_range", "nonzero_padding"}
    MaxDepth = 3
    OldLatch = FALSE
    OldFail = FALSE
INVARIANTS
    UtfBounds
