\* The UTF length checks in the subtraction order: both operands are checked
\* before the subtraction, and the width and the needed count are compared
\* with what remains. TLC must find no error.
SPECIFICATION UtfSpec
CONSTANTS
    WireReasons = {"past_end", "value_out_of_range", "nonzero_padding"}
    MaxDepth = 3
    OldLatch = FALSE
    OldFail = FALSE
INVARIANTS
    UtfBounds
