\* The old order: the byte count is multiplied, wrapping at the machine width,
\* before the sign is checked, and a count that is merely too large is kept.
\* TLC must report BadCountIsEmpty violated by an initial state: a negative
\* count whose bit count is the wrapped product (szBytes = -31, szBits = 8),
\* not an empty reader.
SPECIFICATION SizeSpecOld
CONSTANTS
    WireReasons = {"past_end", "value_out_of_range", "nonzero_padding"}
    MaxDepth = 3
    OldLatch = FALSE
    OldFail = FALSE
INVARIANTS
    BadCountIsEmpty
