\* The reversed witness: the earlier order, which multiplied the byte count
\* by 8 first and refused only a negative count. TLC must report NumBitsSound
\* violated, by a count whose product wraps to a negative bit count on a
\* healthy stream.
SPECIFICATION Spec
CONSTANTS
    WireReasons = {"past_end", "value_out_of_range", "nonzero_padding"}
    MaxDepth = 2
    OldLatch = FALSE
    OldFail = FALSE
    OldSize <- OldSizeOn
INVARIANTS
    TypeOK
    RefusedIffReason
    NoSuccessAfterRefusal
    NumBitsSound
