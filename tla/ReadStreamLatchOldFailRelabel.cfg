\* The 2.0 Fail again, checked for the relabel itself: after a caller's
\* serialize_fail( stream, REFUSAL_NONE ) the stream reports none, and the next
\* read records past_end, so the refused stream's reason changes.
SPECIFICATION Spec
CONSTANTS
    WireReasons = {"past_end", "value_out_of_range", "nonzero_padding"}
    MaxDepth = 3
    OldLatch = FALSE
    OldFail = TRUE
INVARIANTS
    TypeOK
PROPERTIES
    ReasonNeverChanges
