\* The second reversed witness: the 2.0 Fail, which recorded none when handed none
\* (asserted in checked builds, silent in release). TLC must report
\* RefusedIffReason violated by a caller's serialize_fail( stream, REFUSAL_NONE ),
\* and with the invariants off, ReasonNeverChanges violated by the next read
\* relabelling the refusal past_end (ReadStreamLatchOldFailRelabel.cfg).
SPECIFICATION Spec
CONSTANTS
    WireReasons = {"past_end", "value_out_of_range", "nonzero_padding"}
    MaxDepth = 3
    OldLatch = FALSE
    OldFail = TRUE
INVARIANTS
    TypeOK
    RefusedIffReason
    NoSuccessAfterRefusal
